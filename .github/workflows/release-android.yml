name: DEEP-ECHO Mobile Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: deepecho-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify tag, package and version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq 'applicationId = "com.deepecho.mobile"' app/build.gradle.kts
          grep -Fq "versionName = \"${VERSION}\"" app/build.gradle.kts
          test -f "release-input/DEEP-ECHO-Mobile-${VERSION}.apk"
          test -f "release-input/DEEP-ECHO-Mobile-${VERSION}.apk.sha256"
          test -f "RELEASE-NOTES-${VERSION}.md"

      - name: Cloud regression build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify signed release APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="release-input/DEEP-ECHO-Mobile-${VERSION}.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          (cd release-input && sha256sum -c "DEEP-ECHO-Mobile-${VERSION}.apk.sha256")
          "$BT/apksigner" verify --verbose "$APK"

          BADGING="$("$BT/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.deepecho.mobile'"
          echo "$BADGING" | grep -F "versionName='${VERSION}'"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          APK="release-input/DEEP-ECHO-Mobile-${VERSION}.apk"
          SHA="${APK}.sha256"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."
            exit 1
          fi

          gh release create "$TAG" \
            "$APK" \
            "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DEEP-ECHO Mobile ${VERSION}" \
            --notes-file "RELEASE-NOTES-${VERSION}.md"

      - name: Verify published updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$ASSETS" | grep -Fx "DEEP-ECHO-Mobile-${VERSION}.apk"
          echo "$ASSETS" | grep -Fx "DEEP-ECHO-Mobile-${VERSION}.apk.sha256"
