name: DeepEcho Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify DeepEcho Android project
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -Fq 'rootProject.name = "DeepEchoAndroid"' settings.gradle.kts
          grep -Fq 'applicationId = "com.deepecho.android"' app/build.gradle.kts

      - name: Build DeepEcho APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
          dist/DeepEcho-Android-v0.1.0-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepEcho-Android-v0.1.0-alpha-APK
          path: dist/DeepEcho-Android-v0.1.0-alpha.apk
          retention-days: 30
