name: DeepEcho FINAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force known-compatible Android build stack
        shell: bash
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.10" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.10" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.deepecho.android"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.deepecho.android"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0-alpha"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources.excludes += setOf("/META-INF/{AL2.0,LGPL2.1}")
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

              implementation("androidx.compose.ui:ui:1.7.8")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.8")
              implementation("androidx.compose.foundation:foundation:1.7.8")
              implementation("androidx.compose.material3:material3:1.3.2")

              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-session:1.5.1")
              implementation("androidx.media3:media3-common:1.5.1")

              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

              debugImplementation("androidx.compose.ui:ui-tooling:1.7.8")
          }
          EOF

      - name: Verify Android source
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/deepecho/android/MainActivity.kt
          grep -Fq 'rootProject.name = "DeepEchoAndroid"' settings.gradle.kts
          grep -Fq 'package com.deepecho.android' app/src/main/java/com/deepecho/android/MainActivity.kt

      - name: Build APK
        shell: bash
        run: |
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/DeepEcho-Android-v0.1.0-alpha.apk
          sha256sum dist/DeepEcho-Android-v0.1.0-alpha.apk > dist/DeepEcho-Android-v0.1.0-alpha.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepEcho-Android-v0.1.0-alpha-APK
          path: |
            dist/DeepEcho-Android-v0.1.0-alpha.apk
            dist/DeepEcho-Android-v0.1.0-alpha.apk.sha256
          retention-days: 30
          if-no-files-found: error
